# 将 example.com 替换为自己的域名后再启用。
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    root /opt/pokemon-web/current/frontend/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pokemon-acme;
        try_files $uri =404;
    }
    location = /api/team/optimize {
        limit_req zone=pokemon_opt_ip burst=3 nodelay;
        limit_req zone=pokemon_opt_all burst=4 nodelay;
        limit_conn pokemon_compute 2;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/pokemon-proxy.conf;
    }
    location = /api/generations/status {
        default_type application/json;
        return 200 '{"ready":false,"base_ready":false,"lora_ready":false,"warning":"云端轻量演示仅提供图鉴、程序问答、组队和提示词预览，不运行图像生成。","model_label":"云端演示 · 未启用图像模型","busy":false}';
    }
    location = /api/generations {
        default_type application/json;
        if ($request_method = GET) { return 200 '{"items":[]}'; }
        return 403 '{"detail":"云端演示未启用图像生成。"}';
    }
    location = /api/generations/preview {
        limit_req zone=pokemon_api burst=20 nodelay;
        include /etc/nginx/snippets/pokemon-proxy.conf;
    }
    location ^~ /api/generations/ { return 404; }
    location ^~ /api/artwork/ {
        limit_req zone=pokemon_art burst=120 nodelay;
        limit_except GET { deny all; }
        include /etc/nginx/snippets/pokemon-proxy.conf;
    }
    location /api/ {
        limit_req zone=pokemon_api burst=30 nodelay;
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/pokemon-proxy.conf;
    }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location / {
        limit_except GET { deny all; }
        try_files $uri $uri/ /index.html;
    }
    error_page 429 = @busy;
    location @busy {
        default_type application/json;
        return 429 '{"detail":"当前演示请求较多，请等待几秒后重试。"}';
    }
}
